<section class="cta" id="llamada-a-la-accion">

    <div class="cta__container">

        <div class="cta__content">


            <!-- ======================================
                 TÍTULO
            ====================================== -->

            <h2 class="cta__title" data-i18n="cta.title">
                Hace 21 años iniciamos la aventura y hemos crecido!!
            </h2>


            <!-- ======================================
                 DIVISOR
            ====================================== -->

            <span class="cta__divider" aria-hidden="true"></span>


            <!-- ======================================
                 ESTADÍSTICAS
            ====================================== -->

            <div class="cta__stats">

                <p class="cta__stat-item" data-i18n="cta.stats.students">
                    8.000 chicos viajados alrededor del mundo.
                </p>


                <p class="cta__stat-item" data-i18n="cta.stats.destinations">
                    76 destinos esperan por ti
                </p>

            </div>


            <!-- ======================================
                 BOTÓN
            ====================================== -->

            <a class="cta__button" href="#contacto" data-i18n="cta.button">
                Contáctanos
            </a>

        </div>


        <!-- ==========================================
             DECORACIONES
        ========================================== -->

        <span class="cta__decoration cta__decoration--green" aria-hidden="true"></span>


        <span class="cta__decoration cta__decoration--pink" aria-hidden="true"></span>


        <span class="cta__decoration cta__decoration--blue" aria-hidden="true"></span>


        <span class="cta__decoration cta__decoration--purple" aria-hidden="true"></span>


        <span class="cta__decoration cta__decoration--yellow" aria-hidden="true"></span>


        <span class="cta__decoration cta__decoration--red" aria-hidden="true"></span>

    </div>

</section>

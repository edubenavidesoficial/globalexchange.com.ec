<!--
====================================================
COMPONENTE: STATS

Proyecto:
Global Exchange - Migración a Vite

Estado:
- HTML propio y semántico
- Sin Elementor
- Sin WordPress
- Sin GT3
- Contadores animados con JavaScript propio
- Decoraciones controladas con CSS propio

Archivos relacionados:
- src/css/components/stats.css
- src/js/modules/counters.js
====================================================
-->

<section class="stats" id="estadisticas">
    <div class="stats__container">

        <div class="stats__layout">

            <!-- ==========================================
                 COLUMNA IZQUIERDA - CONTADORES
            ========================================== -->

            <div class="stats__data">

                <!-- Fondo decorativo -->
                <div class="stats__background" aria-hidden="true">
                    <img src="/images/stats/home10_ellipse.png" alt="">
                </div>

                <!-- Grid de contadores -->
                <div class="stats__grid">

                    <!-- Estudiantes -->
                    <article class="stats__item stats__item--students" data-counter data-start="10" data-end="8000"
                        data-duration="900" data-separator=",">

                        <span class="stats__number" aria-label="8000 estudiantes viajados">
                            10
                        </span>

                        <p class="stats__label">
                            Estudiantes
                            <br>
                            viajados
                        </p>
                    </article>

                    <!-- Experiencia -->
                    <article class="stats__item stats__item--experience" data-counter data-start="10" data-end="21"
                        data-duration="900" data-separator="">

                        <span class="stats__number" aria-label="21 años de experiencia">
                            10
                        </span>

                        <p class="stats__label">
                            Años de Experiencia
                        </p>
                    </article>

                    <!-- Destinos -->
                    <article class="stats__item stats__item--destinations" data-counter data-start="10" data-end="76"
                        data-duration="900" data-separator="">

                        <span class="stats__number" aria-label="76 destinos">
                            10
                        </span>

                        <p class="stats__label">
                            Destinos
                        </p>
                    </article>

                    <!-- Disponibilidad -->
                    <article class="stats__item stats__item--support" data-counter data-start="10" data-end="100"
                        data-duration="900" data-separator="" data-suffix="%">

                        <span class="stats__number" aria-label="100 por ciento de disponibilidad">
                            10%
                        </span>

                        <p class="stats__label">
                            24h / 7 días a la semana
                        </p>
                    </article>

                </div>

                <!-- Decoraciones columna izquierda -->

                <div class="stats__shape stats__shape--left-plus" aria-hidden="true">

                    <img src="/images/decorations/home_06_icon_23.png" alt="">
                </div>

                <div class="stats__shape stats__shape--left-cross" aria-hidden="true">

                    <img src="/images/decorations/home_06_icon_22.png" alt="">
                </div>

                <div class="stats__shape stats__shape--left-triangle" aria-hidden="true">

                    <img src="/images/decorations/triangle_blue.png" alt="">
                </div>

            </div>

            <!-- ==========================================
                 COLUMNA DERECHA - IMAGEN
            ========================================== -->

            <div class="stats__visual">

                <div class="stats__image">
                    <img src="/images/stats/111.jpg" alt="Estudiante de Global Exchange en el extranjero"
                        loading="lazy">
                </div>

                <!-- Decoraciones columna derecha -->

                <div class="stats__shape stats__shape--right-circle" aria-hidden="true">

                    <img src="/images/decorations/circle.png" alt="">
                </div>

                <div class="stats__shape stats__shape--right-triangle" aria-hidden="true">

                    <img src="/images/decorations/triangle_orange.png" alt="">
                </div>

                <div class="stats__shape stats__shape--right-cross" aria-hidden="true">

                    <img src="/images/decorations/home_06_icon_22.png" alt="">
                </div>

            </div>

        </div>

    </div>
</section>

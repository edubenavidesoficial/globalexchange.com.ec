<section class="map" id="mapa-global">

    <div class="map__container">


        <!-- ==========================================
             TÍTULO
        ========================================== -->

        <header class="map__header">

            <h2 class="map__title">

                <span data-i18n="map.title.line1">
                    ¡Te invitamos a conocer nuestro Mundo Global!
                </span>

                <br>

                <span data-i18n="map.title.line2">
                    ¡Consulta también nuestros destinos en Ecuador!
                </span>

            </h2>

        </header>


        <!-- ==========================================
             IMAGEN PRINCIPAL
        ========================================== -->

        <div class="map__image">

            <img src="/images/map/mapafinal-1-2048x862.jpg" alt="Mapa de destinos internacionales de Global Exchange"
                data-i18n-alt="map.imageAlt" loading="lazy">

        </div>


        <!-- ==========================================
             PARTNERS Y CERTIFICACIONES
        ========================================== -->

        <div class="map__partners">

            <img src="/images/partners/logosExtras-1.png"
                alt="Certificaciones y aliados internacionales de Global Exchange" data-i18n-alt="map.partnersAlt"
                loading="lazy">

        </div>

    </div>

</section>

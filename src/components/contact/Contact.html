<!--
====================================================
COMPONENTE: CONTACT

Proyecto:
Global Exchange - Migración a Vite

Estado:
- HTML propio y semántico
- Sin Elementor
- Sin WordPress
- Sin Contact Form 7
- Formulario con validación propia
====================================================
-->

<section class="contact" id="contacto">
    <div class="contact__container">

        <div class="contact__layout">

            <!-- ==========================================
                 COLUMNA IZQUIERDA - IMAGEN
            ========================================== -->

            <div class="contact__visual">

                <div class="contact__image">
                    <img src="/images/contact/home10_img5.jpg" alt="Asesora de Global Exchange atendiendo a estudiantes"
                        loading="lazy">
                </div>

                <!-- Decoraciones -->

                <span class="contact__decoration contact__decoration--dot-top" aria-hidden="true">
                </span>

                <span class="contact__decoration contact__decoration--dot-bottom" aria-hidden="true">
                </span>

            </div>

            <!-- ==========================================
                 COLUMNA DERECHA - FORMULARIO
            ========================================== -->

            <div class="contact__content">

                <header class="contact__header">
                    <h2 class="contact__title">
                        GLOBAL EXCHANGE
                    </h2>

                    <p class="contact__description">
                        Convertimos a estudiantes en ciudadanos del mundo con
                        más oportunidades.
                    </p>
                </header>

                <form class="contact__form" data-contact-form novalidate>

                    <!-- Nombre -->

                    <div class="contact__field">
                        <label class="contact__label" for="contact-name">

                            Nombre
                        </label>

                        <input id="contact-name" class="contact__input" type="text" name="name" placeholder="Tu nombre*"
                            autocomplete="name" required>

                        <small class="contact__error" data-error-for="contact-name">
                        </small>
                    </div>

                    <!-- Email -->

                    <div class="contact__field">
                        <label class="contact__label" for="contact-email">

                            Correo electrónico
                        </label>

                        <input id="contact-email" class="contact__input" type="email" name="email"
                            placeholder="Correo electrónico*" autocomplete="email" required>

                        <small class="contact__error" data-error-for="contact-email">
                        </small>
                    </div>

                    <!-- Teléfono -->

                    <div class="contact__field">
                        <label class="contact__label" for="contact-phone">

                            Teléfono
                        </label>

                        <input id="contact-phone" class="contact__input" type="tel" name="phone" placeholder="Teléfono"
                            autocomplete="tel">

                        <small class="contact__error" data-error-for="contact-phone">
                        </small>
                    </div>

                    <!-- Sitio web -->

                    <div class="contact__field">
                        <label class="contact__label" for="contact-website">

                            Sitio web
                        </label>

                        <input id="contact-website" class="contact__input" type="url" name="website"
                            placeholder="Sitio web" autocomplete="url">

                        <small class="contact__error" data-error-for="contact-website">
                        </small>
                    </div>

                    <!-- Mensaje -->

                    <div class="contact__field contact__field--message">
                        <label class="contact__label" for="contact-message">

                            Mensaje
                        </label>

                        <textarea id="contact-message" class="contact__textarea" name="message" rows="6"
                            placeholder="Mensaje*" required></textarea>

                        <small class="contact__error" data-error-for="contact-message">
                        </small>
                    </div>

                    <!-- Botón -->

                    <div class="contact__actions">
                        <button class="contact__submit" type="submit">

                            Enviar mensaje
                        </button>
                    </div>

                    <!-- Estado -->

                    <p class="contact__status" data-contact-status role="status" aria-live="polite">
                    </p>

                </form>

            </div>

        </div>

    </div>
</section>
